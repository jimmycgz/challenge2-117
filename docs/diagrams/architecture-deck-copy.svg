<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">RescueBroker architecture</title>
  <desc id="d">A coordinator pastes a surplus-food offer. An identity guard checks its own cloud project, then the food_broker ADK agent on Gemini on Vertex AI, running on Cloud Run, calls three tools: lookup_shelf_life, find_matches and explain_candidate. The tools read the BigQuery dataset a4i_food: shelf_life, tract_demographics and recipient_embeddings. For free-form data questions the agent uses Google's managed BigQuery MCP server, told to read only, over the same dataset, which also holds recipients (192 rows) and surplus_postings. Inside find_matches: a vector search for the 80 nearest recipients, hard filters on cold storage, freezer, pallets and the clock that remove recipients with the reason kept, ranking with margin first, the nearest census tract, and a six-part Match Brief that goes back to the coordinator.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .h1 { font-size: 44px; font-weight: 700; }
      .h2 { font-size: 26px; font-weight: 700; }
      .name { font-size: 24px; font-weight: 700; }
      .big { font-size: 30px; font-weight: 700; }
      .sub { font-size: 22px; }
      .c { text-anchor: middle; }
      .box { fill: #2a2c32; stroke-width: 3; }
      .frame { fill: none; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .flow { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .blue { stroke: #4285f4; }
      .violet { stroke: #9b72cf; }
      .green { stroke: #34a853; }
      .red { stroke: #e8506a; }
      .grey { stroke: #9aa0a6; }
    </style>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4285f4"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9b72cf"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34a853"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#212226"/>

  <!-- Title and legend -->
    <g>
    <line x1="1180" y1="68" x2="1220" y2="68" class="flow blue"/>
    <text class="sub" x="1232" y="76">agent path</text>
    <line x1="1390" y1="68" x2="1430" y2="68" class="flow violet"/>
    <text class="sub" x="1442" y="76">data</text>
    <line x1="1530" y1="68" x2="1570" y2="68" class="flow green"/>
    <text class="sub" x="1582" y="76">result</text>
    <line x1="1690" y1="68" x2="1730" y2="68" class="flow red"/>
    <text class="sub" x="1742" y="76">filters</text>
  </g>

  <!-- Coordinator -->
  <rect class="box grey" x="30" y="250" width="220" height="230" rx="18"/>
  <circle cx="140" cy="305" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M100 367 a40 34 0 0 1 80 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text class="name c" x="140" y="412">Coordinator</text>
  <text class="sub c" x="140" y="446">pastes an offer</text>

  <!-- Cloud Run frame -->
  <rect class="frame grey" x="320" y="130" width="980" height="470" rx="22"/>
  <text class="h2" x="348" y="174">Cloud Run</text>

  <!-- Offer in -->
  <path class="flow blue" d="M252 350 H344" marker-end="url(#ab)"/>
  <text class="sub c" x="285" y="334">offer</text>

  <!-- Identity guard -->
  <rect class="box grey" x="350" y="280" width="220" height="140" rx="16"/>
  <path d="M460 294 L482 302 V318 C482 332 472 341 460 347 C448 341 438 332 438 318 V302 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M450 320 L457 327 L470 312" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="name c" x="460" y="380">Identity guard</text>
  <text class="sub c" x="460" y="408">checks its project</text>

  <path class="flow blue" d="M572 350 H614" marker-end="url(#ab)"/>

  <!-- Agent -->
  <rect class="box blue" x="620" y="240" width="280" height="250" rx="18"/>
  <text class="big c" x="760" y="296">food_broker</text>
  <text class="sub c" x="760" y="330">ADK agent</text>
  <line x1="652" y1="356" x2="868" y2="356" stroke="#4285f4" stroke-width="2"/>
  <text class="name c" x="760" y="398">Gemini on Vertex AI</text>
  
  <!-- Agent to tools -->
  <path class="flow blue" d="M902 370 C946 370 946 235 984 235" marker-end="url(#ab)"/>
  <path class="flow blue" d="M902 370 H984" marker-end="url(#ab)"/>
  <path class="flow blue" d="M902 370 C946 370 946 505 984 505" marker-end="url(#ab)"/>

  <!-- Tools -->
  <rect class="box blue" x="990" y="195" width="280" height="80" rx="14"/>
  <text class="name c" x="1130" y="229">lookup_shelf_life</text>
  <text class="sub c" x="1130" y="259">shelf-life hours</text>

  <rect class="box blue" x="990" y="330" width="280" height="80" rx="14"/>
  <text class="name c" x="1130" y="364">find_matches</text>
  <text class="sub c" x="1130" y="394">ranked matches</text>

  <rect class="box blue" x="990" y="465" width="280" height="80" rx="14"/>
  <text class="name c" x="1130" y="499">explain_candidate</text>
  <text class="sub c" x="1130" y="529">why not X</text>

  <!-- Agent to MCP -->
  <path class="flow blue" d="M760 492 V695 H984" marker-end="url(#ab)"/>
  <text class="sub c" x="872" y="680">data questions</text>

  <!-- MCP server -->
  <rect class="box blue" x="990" y="650" width="280" height="90" rx="14"/>
  <text class="name c" x="1130" y="687">BigQuery MCP</text>
  <text class="sub c" x="1130" y="718">Google-managed</text>

  <path class="flow violet" d="M1272 695 H1394" marker-end="url(#av)"/>
  
  <!-- Dataset -->
  <rect class="frame violet" x="1400" y="130" width="480" height="610" rx="22"/>
  <text class="h2" x="1430" y="174">BigQuery <tspan class="sub" font-weight="400">a4i_food</tspan></text>

  <rect class="box violet" x="1430" y="212" width="420" height="66" rx="12"/>
  <text class="name" x="1456" y="253">shelf_life</text>
  <rect class="box violet" x="1430" y="307" width="420" height="66" rx="12"/>
  <text class="name" x="1456" y="348">tract_demographics</text>
  <rect class="box violet" x="1430" y="402" width="420" height="66" rx="12"/>
  <text class="name" x="1456" y="443">recipient_embeddings</text>
  <rect class="box violet" x="1430" y="497" width="420" height="66" rx="12"/>
  <text class="name" x="1456" y="538">recipients</text>
  <text class="sub" x="1826" y="538" text-anchor="end">192 (9 invented)</text>
  <rect class="box violet" x="1430" y="592" width="420" height="66" rx="12"/>
  <text class="name" x="1456" y="633">surplus_postings</text>

  <!-- Tools to tables -->
  <path class="flow violet" d="M1272 235 C1350 235 1350 245 1424 245" marker-end="url(#av)"/>
  <path class="flow violet" d="M1272 360 C1350 360 1350 340 1424 340" marker-end="url(#av)"/>
  <path class="flow violet" d="M1272 380 C1350 380 1350 425 1424 425" marker-end="url(#av)"/>
  <path class="flow violet" d="M1272 505 C1350 505 1350 445 1424 445" marker-end="url(#av)"/>

  <!-- Result back to the coordinator -->
  <path class="flow green" d="M618 455 H258" stroke-width="5" marker-end="url(#ag)"/>
  <text class="name c" x="446" y="494">Match Brief</text>
  <text class="sub c" x="446" y="526">six parts</text>

  <!-- Inside find_matches -->
  <rect class="frame blue" x="40" y="785" width="1840" height="275" rx="22"/>
  <text class="h2" x="70" y="830">Inside find_matches</text>

  <rect class="box blue" x="70" y="850" width="300" height="130" rx="16"/>
  <text class="h2 c" x="220" y="903">Vector search</text>
  <text class="sub c" x="220" y="938">80 nearest</text>
  <rect x="122" y="1006" width="18" height="18" rx="3" fill="#9b72cf"/>
  <text class="sub" x="150" y="1023">recipient_embeddings</text>

  <path class="flow blue" d="M374 915 H432" marker-end="url(#ab)"/>

  <rect class="box red" x="440" y="850" width="300" height="130" rx="16" style="fill:#e8506a;fill-opacity:0.14"/>
  <text class="h2 c" x="590" y="893">Hard filters</text>
  <text class="sub c" x="590" y="928">cold · freezer</text>
  <text class="sub c" x="590" y="958">pallets · clock</text>
  <path d="M486 1006 L502 1022 M502 1006 L486 1022" stroke="#e8506a" stroke-width="4" stroke-linecap="round"/>
  <text class="sub" x="514" y="1023">removed, reason kept</text>

  <path class="flow blue" d="M744 915 H802" marker-end="url(#ab)"/>

  <rect class="box blue" x="810" y="850" width="300" height="130" rx="16"/>
  <text class="h2 c" x="960" y="903">Rank</text>
  <text class="sub c" x="960" y="938">margin first</text>

  <path class="flow blue" d="M1114 915 H1172" marker-end="url(#ab)"/>

  <rect class="box blue" x="1180" y="850" width="300" height="130" rx="16"/>
  <text class="h2 c" x="1330" y="903">Neighborhood</text>
  <text class="sub c" x="1330" y="938">nearest tract</text>
  <rect x="1240" y="1006" width="18" height="18" rx="3" fill="#9b72cf"/>
  <text class="sub" x="1268" y="1023">tract_demographics</text>

  <path class="flow green" d="M1484 915 H1542" marker-end="url(#ag)"/>

  <rect class="box green" x="1550" y="850" width="300" height="130" rx="16" style="fill:#34a853;fill-opacity:0.16"/>
  <text class="h2 c" x="1700" y="903">Match Brief</text>
  <text class="sub c" x="1700" y="938">six parts</text>
</svg>
